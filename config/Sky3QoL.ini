[HUD]
; Restart the game after changing these settings.
Enabled=1
Position=top-right
Style=gold

[Audio]
; Dialogue voices follow the game's sound-effects volume and mute settings.
LinkVoicesToSE=1
; Additional voice attenuation, 0 through 100 percent.
VoiceGainPercent=100

[Mouse]
; DX9: prevent the game from automatically moving the physical mouse pointer.
DisableCursorSnap=1
; Keep the top bar open until Escape or an outside left-click.
StickyTopBar=1
; Start mouse navigation at the physical pointer instead of selecting Status.
ClearTopBarSelection=1
